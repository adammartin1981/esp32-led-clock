; ESP32 WS2812 LED ring clock
; Build & flash:
;   pio run -t upload
;   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<pinscan.cpp>

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.1.0
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git

; Diagnostic build: cycles the strip's data signal across common GPIOs one at a
; time so you can see which physical pin actually lights it up.
;   pio run -e pinscan -t upload -t monitor
[env:pinscan]
extends = env:esp32dev
build_src_filter = +<pinscan.cpp> -<main.cpp>


build_flags =
    -DCORE_DEBUG_LEVEL=1
